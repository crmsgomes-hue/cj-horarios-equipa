<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CJ Horários — Equipa</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{--bg:#f4f6fb;--bg-elev:#ffffff;--card:#ffffff;--border:#e3e8f2;--text:#1c2333;--text-dim:#707a8f;--accent:#3568f0;--accent-2:#5b8bff;--accent-dim:#e9eefd;--danger:#e0453f;--danger-dim:#fdecea;--ok:#1fa971;--ok-dim:#e7f8f0;--warn:#e08a1f;--warn-dim:#fdf1e0;--fc:#12b3a0;--fo:#f2673d;--radius:14px;--shadow:0 1px 3px rgba(20,30,60,.06),0 1px 2px rgba(20,30,60,.04);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
  .screen{display:none;min-height:100vh;flex-direction:column;}
  .screen.active{display:flex;}
  header.top{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg-elev);}
  header.top h1{font-size:17px;font-weight:700;margin:0;}
  header.top .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .btn-icon{background:none;border:none;color:var(--text-dim);font-size:13px;padding:6px;}

  #login{align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,var(--accent-2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;box-shadow:0 10px 24px rgba(53,104,240,.28);}
  .login-box h2{margin:0 0 4px;font-size:20px;}
  .login-box p{color:var(--text-dim);font-size:13px;margin:0 0 28px;}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
  .pin-dots span{width:12px;height:12px;border-radius:50%;background:var(--border);}
  .pin-dots span.filled{background:var(--accent);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
  .keypad button{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px;box-shadow:var(--shadow);}
  .keypad button:active{background:var(--accent-dim);}
  #login-error{color:var(--danger);font-size:13px;height:18px;margin-top:14px;}

  .week-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  .week-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;box-shadow:var(--shadow);}
  .week-nav .label{font-size:14px;font-weight:600;}
  .day-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);}
  .day-row .dow{width:64px;flex-shrink:0;}
  .day-row .dow .d{font-size:13px;font-weight:600;}
  .day-row .dow .n{font-size:11px;color:var(--text-dim);}
  .day-row .shift{flex:1;background:var(--accent-dim);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;}
  .day-row .shift.empty{color:var(--text-dim);border:1px dashed var(--border);background:none;text-align:center;font-weight:400;}
  .day-row .shift.fc{background:#e2f8f5;color:var(--fc);}
  .day-row .shift.fo{background:#fdece4;color:var(--fo);}
  .day-row .shift .night{color:#8b5cf6;}

  .fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;border:none;font-size:26px;box-shadow:0 10px 22px rgba(53,104,240,.35);}
  .tabbar{display:flex;gap:4px;margin:14px 20px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);}
  .tabbar button{flex:1;background:none;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 0;border-radius:999px;}
  .tabbar button .ic{font-size:14px;}
  .tabbar button.active{color:#fff;background:linear-gradient(145deg,var(--accent-2),var(--accent));}

  .modal-bg{position:fixed;inset:0;background:rgba(20,26,44,.45);display:none;align-items:flex-end;z-index:50;}
  .modal-bg.active{display:flex;}
  .modal{background:var(--bg-elev);width:100%;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(20,30,60,.12);}
  .modal h3{margin:0 0 18px;font-size:17px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:15px;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex;gap:10px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;}
  .btn.primary{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;}
  .btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);}

  #ferias-list{padding:16px 20px;}
  .fer-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .fer-card .dates{font-size:14px;font-weight:600;}
  .fer-card .status{font-size:11px;margin-top:4px;display:inline-block;padding:3px 8px;border-radius:20px;font-weight:600;}
  .status.pendente{background:var(--warn-dim);color:var(--warn);}
  .status.aprovado{background:var(--ok-dim);color:var(--ok);}
  .status.recusado{background:var(--danger-dim);color:var(--danger);}
  .empty-state{text-align:center;padding:60px 30px;color:var(--text-dim);}
  .empty-state .ic{font-size:40px;margin-bottom:12px;}
</style>
</head>
<body>

<div id="login" class="screen active">
  <div class="login-box">
    <div class="logo">🕒</div>
    <h2>O meu Horário</h2>
    <p>Entra com o teu utilizador</p>
    <div class="field" style="text-align:left">
      <label>Utilizador</label>
      <input type="text" id="loginUsername" autocapitalize="none" autocomplete="username">
    </div>
    <div class="field" style="text-align:left">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn primary" style="width:100%" onclick="tentarLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="semana" class="screen">
  <header class="top">
    <div><h1>O meu Horário</h1><div class="sub" id="user-loja"></div></div>
    <button class="btn-icon" onclick="logout()">Sair</button>
  </header>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <div class="label" id="weekLabel"></div>
    <button onclick="changeWeek(1)">›</button>
  </div>
  <div id="weekList"></div>
  <div class="tabbar">
    <button class="tab-btn active" data-tab="semana" onclick="switchTab('semana')"><span class="ic">📅</span>O meu horário</button>
    <button class="tab-btn" data-tab="ferias" onclick="switchTab('ferias')"><span class="ic">🌴</span>Férias</button>
  </div>
</div>

<div id="ferias" class="screen">
  <header class="top">
    <div><h1>Férias</h1><div class="sub" id="user-loja2"></div></div>
    <button class="btn-icon" onclick="logout()">Sair</button>
  </header>
  <div id="ferias-list"></div>
  <button class="fab" onclick="openFeriasModal()">+</button>
  <div class="tabbar">
    <button class="tab-btn" data-tab="semana" onclick="switchTab('semana')"><span class="ic">📅</span>O meu horário</button>
    <button class="tab-btn active" data-tab="ferias" onclick="switchTab('ferias')"><span class="ic">🌴</span>Férias</button>
  </div>
</div>

<div class="modal-bg" id="modalFerias">
  <div class="modal">
    <h3>Pedir férias</h3>
    <div class="row2">
      <div class="field"><label>De</label><input type="date" id="fInicio"></div>
      <div class="field"><label>Até</label><input type="date" id="fFim"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="guardarFerias()">Pedir</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mnbtfatkdllhsekmnpzk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uYnRmYXRrZGxsaHNla21ucHprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODMyNjYsImV4cCI6MjEwMjY1OTI2Nn0.pPHvX8HStZ7vqK_LqlTUG33YPITGzbwkjEfHovTxbSA";

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": opts.prefer || "return=representation", ...(opts.headers || {}) }
  });
  if (!res.ok) { console.error(await res.text()); throw new Error("Erro Supabase"); }
  return res.status === 204 ? null : res.json();
}

let state = { user: null, loja: null, weekStart: null, turnos: [] };

async function sha256Hex(texto) {
  const enc = new TextEncoder().encode(texto);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function tentarLogin() {
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  const username = document.getElementById("loginUsername").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;
  if (!username || !password) { errEl.textContent = "Preenche o utilizador e a password."; return; }
  try {
    const password_hash = await sha256Hex(password);
    const users = await sb(`cj_utilizadores?username=eq.${encodeURIComponent(username)}&password_hash=eq.${password_hash}&ativo=eq.true&papel=eq.funcionario&select=*`);
    if (!users.length) throw new Error("Credenciais inválidas");
    state.user = users[0];
    const lojas = await sb(`cj_lojas?id=eq.${state.user.loja_id}&select=*`);
    state.loja = lojas[0];
    document.getElementById("user-loja").textContent = `${state.user.nome} · ${state.loja?.nome || ""}`;
    document.getElementById("user-loja2").textContent = `${state.user.nome} · ${state.loja?.nome || ""}`;
    state.weekStart = startOfWeek(new Date());
    showScreen("semana");
    await carregarSemana();
  } catch (e) {
    errEl.textContent = "Utilizador ou password incorretos";
  }
}
function logout() {
  state = { user: null, loja: null, weekStart: null, turnos: [] };
  document.getElementById("loginUsername").value = "";
  document.getElementById("loginPassword").value = "";
  showScreen("login");
}
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function switchTab(tab) {
  if (tab === "ferias") { showScreen("ferias"); carregarFerias(); }
  else { showScreen("semana"); }
}

function startOfWeek(d) { const date = new Date(d); const day = (date.getDay() + 6) % 7; date.setDate(date.getDate() - day); date.setHours(0,0,0,0); return date; }
function changeWeek(delta) { state.weekStart.setDate(state.weekStart.getDate() + delta * 7); carregarSemana(); }
function fmtDate(d) { return d.toISOString().slice(0,10); }
function fmtLabel(d) { return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "short" }); }

async function carregarSemana() {
  const start = new Date(state.weekStart);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  document.getElementById("weekLabel").textContent = `${fmtLabel(start)} – ${fmtLabel(end)}`;
  state.turnos = await sb(`cj_horarios_turnos?loja_id=eq.${state.loja.id}&utilizador_id=eq.${state.user.id}&data=gte.${fmtDate(start)}&data=lte.${fmtDate(end)}&select=*&order=data`);

  const dias = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const list = document.getElementById("weekList");
  list.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const iso = fmtDate(d);
    const turnosDia = state.turnos.filter(t => t.data === iso);
    const row = document.createElement("div");
    row.className = "day-row";
    const dowHtml = `<div class="dow"><div class="d">${dias[i]}</div><div class="n">${d.getDate()}/${d.getMonth()+1}</div></div>`;
    if (!turnosDia.length) row.innerHTML = dowHtml + `<div class="shift empty">Sem turno</div>`;
    else {
      const shiftsHtml = turnosDia.map(t => {
        if (t.tipo === "folga_complementar") return `<div class="shift fc">FC — Folga Complementar</div>`;
        if (t.tipo === "folga_obrigatoria") return `<div class="shift fo">FO — Folga Obrigatória</div>`;
        return `<div class="shift">${t.hora_inicio?.slice(0,5)} – ${t.hora_fim?.slice(0,5)}${t.noturno ? '<span class="night"> · noturno</span>' : ''}${t.almoco_horas > 0 ? `<div style="font-size:11px;color:var(--text-dim);margin-top:2px">🍽 ${t.almoco_horas}h de almoço</div>` : ''}</div>`;
      }).join("");
      row.innerHTML = dowHtml + shiftsHtml;
    }
    list.appendChild(row);
  }
}

async function carregarFerias() {
  const lista = await sb(`cj_horarios_pedidos_ferias?loja_id=eq.${state.loja.id}&utilizador_id=eq.${state.user.id}&select=*&order=data_inicio.desc`);
  const list = document.getElementById("ferias-list");
  if (!lista.length) { list.innerHTML = `<div class="empty-state"><div class="ic">🌴</div>Ainda não pediste férias</div>`; return; }
  list.innerHTML = lista.map(f => `
    <div class="fer-card">
      <div class="dates">${new Date(f.data_inicio).toLocaleDateString("pt-PT")} – ${new Date(f.data_fim).toLocaleDateString("pt-PT")}</div>
      <span class="status ${f.estado}">${f.estado}</span>
    </div>`).join("");
}
function openFeriasModal() { document.getElementById("fInicio").value = ""; document.getElementById("fFim").value = ""; document.getElementById("modalFerias").classList.add("active"); }
function closeModal() { document.getElementById("modalFerias").classList.remove("active"); }
async function guardarFerias() {
  const data_inicio = document.getElementById("fInicio").value;
  const data_fim = document.getElementById("fFim").value;
  if (!data_inicio || !data_fim) return;
  await sb("cj_horarios_pedidos_ferias", { method: "POST", body: JSON.stringify([{ loja_id: state.loja.id, utilizador_id: state.user.id, data_inicio, data_fim }]) });
  closeModal();
  carregarFerias();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/cj-horarios-equipa/service-worker.js", { scope: "/cj-horarios-equipa/" }).catch(() => {});
  });
}
</script>
</body>
</html>
