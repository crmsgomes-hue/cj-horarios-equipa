<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CJ Horários — Equipa</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0f172a;--bg-elev:#16213a;--card:#1c2a47;--border:#2a3a5c;--text:#eef2fb;--text-dim:#93a1c2;--accent:#e8a33d;--accent-dim:#5c4720;--danger:#e2584a;--ok:#4fae7d;--radius:14px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
  .screen{display:none;min-height:100vh;flex-direction:column;}
  .screen.active{display:flex;}
  header.top{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  header.top h1{font-size:17px;font-weight:600;margin:0;}
  header.top .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .btn-icon{background:none;border:none;color:var(--text-dim);font-size:13px;padding:6px;}

  #login{align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,var(--accent),#c47e1f);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(232,163,61,.25);}
  .login-box h2{margin:0 0 4px;font-size:20px;}
  .login-box p{color:var(--text-dim);font-size:13px;margin:0 0 28px;}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
  .pin-dots span{width:12px;height:12px;border-radius:50%;background:var(--border);}
  .pin-dots span.filled{background:var(--accent);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
  .keypad button{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px;}
  .keypad button:active{background:var(--border);}
  #login-error{color:var(--danger);font-size:13px;height:18px;margin-top:14px;}

  .week-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  .week-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;}
  .week-nav .label{font-size:14px;font-weight:600;}
  .day-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);}
  .day-row .dow{width:64px;flex-shrink:0;}
  .day-row .dow .d{font-size:13px;font-weight:600;}
  .day-row .dow .n{font-size:11px;color:var(--text-dim);}
  .day-row .shift{flex:1;background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px;}
  .day-row .shift.empty{color:var(--text-dim);border:1px dashed var(--border);background:none;text-align:center;}
  .day-row .shift.folga{color:var(--text-dim);font-style:italic;}
  .day-row .shift .night{color:var(--accent);}

  .fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#1a1200;border:none;font-size:26px;box-shadow:0 8px 20px rgba(232,163,61,.35);}
  .tabbar{display:flex;border-top:1px solid var(--border);background:var(--bg-elev);padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;background:none;border:none;color:var(--text-dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .tabbar button .ic{font-size:19px;}
  .tabbar button.active{color:var(--accent);}

  .modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.7);display:none;align-items:flex-end;z-index:50;}
  .modal-bg.active{display:flex;}
  .modal{background:var(--bg-elev);width:100%;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));}
  .modal h3{margin:0 0 18px;font-size:17px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:15px;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex;gap:10px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;}
  .btn.primary{background:var(--accent);color:#1a1200;}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}

  #ferias-list{padding:16px 20px;}
  .fer-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .fer-card .dates{font-size:14px;font-weight:600;}
  .fer-card .status{font-size:11px;margin-top:4px;display:inline-block;padding:3px 8px;border-radius:20px;}
  .status.pendente{background:#3a3013;color:var(--accent);}
  .status.aprovado{background:#123a26;color:var(--ok);}
  .status.recusado{background:#3a1a17;color:var(--danger);}
  .empty-state{text-align:center;padding:60px 30px;color:var(--text-dim);}
  .empty-state .ic{font-size:40px;margin-bottom:12px;}
</style>
</head>
<body>

<div id="login" class="screen active">
  <div class="login-box">
    <div class="logo">🕒</div>
    <h2>O meu Horário</h2>
    <p>Introduz o teu PIN</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button></button><button data-k="0">0</button><button data-k="del">⌫</button>
    </div>
    <div id="login-error"></div>
  </div>
</div>

<div id="semana" class="screen">
  <header class="top">
    <div><h1>O meu Horário</h1><div class="sub" id="user-loja"></div></div>
    <button class="btn-icon" onclick="logout()">Sair</button>
  </header>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <div class="label" id="weekLabel"></div>
    <button onclick="changeWeek(1)">›</button>
  </div>
  <div id="weekList"></div>
  <div class="tabbar">
    <button class="tab-btn active" data-tab="semana" onclick="switchTab('semana')"><span class="ic">📅</span>O meu horário</button>
    <button class="tab-btn" data-tab="ferias" onclick="switchTab('ferias')"><span class="ic">🌴</span>Férias</button>
  </div>
</div>

<div id="ferias" class="screen">
  <header class="top">
    <div><h1>Férias</h1><div class="sub" id="user-loja2"></div></div>
    <button class="btn-icon" onclick="logout()">Sair</button>
  </header>
  <div id="ferias-list"></div>
  <button class="fab" onclick="openFeriasModal()">+</button>
  <div class="tabbar">
    <button class="tab-btn" data-tab="semana" onclick="switchTab('semana')"><span class="ic">📅</span>O meu horário</button>
    <button class="tab-btn active" data-tab="ferias" onclick="switchTab('ferias')"><span class="ic">🌴</span>Férias</button>
  </div>
</div>

<div class="modal-bg" id="modalFerias">
  <div class="modal">
    <h3>Pedir férias</h3>
    <div class="row2">
      <div class="field"><label>De</label><input type="date" id="fInicio"></div>
      <div class="field"><label>Até</label><input type="date" id="fFim"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="guardarFerias()">Pedir</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mnbtfatkdllhsekmnpzk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uYnRmYXRrZGxsaHNla21ucHprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODMyNjYsImV4cCI6MjEwMjY1OTI2Nn0.pPHvX8HStZ7vqK_LqlTUG33YPITGzbwkjEfHovTxbSA";

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": opts.prefer || "return=representation", ...(opts.headers || {}) }
  });
  if (!res.ok) { console.error(await res.text()); throw new Error("Erro Supabase"); }
  return res.status === 204 ? null : res.json();
}

let state = { pin: "", user: null, loja: null, weekStart: null, turnos: [] };

const pinDots = document.getElementById("pinDots").children;
document.querySelectorAll(".keypad button[data-k]").forEach(btn => {
  btn.addEventListener("click", () => {
    const k = btn.dataset.k;
    if (k === "del") state.pin = state.pin.slice(0, -1);
    else if (state.pin.length < 4) state.pin += k;
    renderPin();
    if (state.pin.length === 4) tentarLogin();
  });
});
function renderPin() { for (let i = 0; i < 4; i++) pinDots[i].classList.toggle("filled", i < state.pin.length); }

async function tentarLogin() {
  document.getElementById("login-error").textContent = "";
  try {
    // Esta app é só para funcionários — gerentes usam o CJ Horários completo
    const users = await sb(`cj_utilizadores?pin=eq.${state.pin}&ativo=eq.true&papel=eq.funcionario&select=*`);
    if (!users.length) throw new Error("PIN inválido");
    state.user = users[0];
    const lojas = await sb(`cj_lojas?id=eq.${state.user.loja_id}&select=*`);
    state.loja = lojas[0];
    document.getElementById("user-loja").textContent = `${state.user.nome} · ${state.loja?.nome || ""}`;
    document.getElementById("user-loja2").textContent = `${state.user.nome} · ${state.loja?.nome || ""}`;
    state.weekStart = startOfWeek(new Date());
    showScreen("semana");
    await carregarSemana();
  } catch (e) {
    document.getElementById("login-error").textContent = "PIN não reconhecido";
    state.pin = ""; renderPin();
  }
}
function logout() { state = { pin: "", user: null, loja: null, weekStart: null, turnos: [] }; renderPin(); showScreen("login"); }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function switchTab(tab) {
  if (tab === "ferias") { showScreen("ferias"); carregarFerias(); }
  else { showScreen("semana"); }
}

function startOfWeek(d) { const date = new Date(d); const day = (date.getDay() + 6) % 7; date.setDate(date.getDate() - day); date.setHours(0,0,0,0); return date; }
function changeWeek(delta) { state.weekStart.setDate(state.weekStart.getDate() + delta * 7); carregarSemana(); }
function fmtDate(d) { return d.toISOString().slice(0,10); }
function fmtLabel(d) { return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "short" }); }

async function carregarSemana() {
  const start = new Date(state.weekStart);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  document.getElementById("weekLabel").textContent = `${fmtLabel(start)} – ${fmtLabel(end)}`;
  state.turnos = await sb(`cj_horarios_turnos?loja_id=eq.${state.loja.id}&utilizador_id=eq.${state.user.id}&data=gte.${fmtDate(start)}&data=lte.${fmtDate(end)}&select=*&order=data`);

  const dias = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const list = document.getElementById("weekList");
  list.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const iso = fmtDate(d);
    const turnosDia = state.turnos.filter(t => t.data === iso);
    const row = document.createElement("div");
    row.className = "day-row";
    const dowHtml = `<div class="dow"><div class="d">${dias[i]}</div><div class="n">${d.getDate()}/${d.getMonth()+1}</div></div>`;
    if (!turnosDia.length) row.innerHTML = dowHtml + `<div class="shift empty">Sem turno</div>`;
    else {
      const shiftsHtml = turnosDia.map(t => t.tipo === "folga"
        ? `<div class="shift folga">🌙 Folga</div>`
        : `<div class="shift">${t.hora_inicio?.slice(0,5)} – ${t.hora_fim?.slice(0,5)}${t.noturno ? '<span class="night"> · noturno</span>' : ''}</div>`
      ).join("");
      row.innerHTML = dowHtml + shiftsHtml;
    }
    list.appendChild(row);
  }
}

async function carregarFerias() {
  const lista = await sb(`cj_horarios_pedidos_ferias?loja_id=eq.${state.loja.id}&utilizador_id=eq.${state.user.id}&select=*&order=data_inicio.desc`);
  const list = document.getElementById("ferias-list");
  if (!lista.length) { list.innerHTML = `<div class="empty-state"><div class="ic">🌴</div>Ainda não pediste férias</div>`; return; }
  list.innerHTML = lista.map(f => `
    <div class="fer-card">
      <div class="dates">${new Date(f.data_inicio).toLocaleDateString("pt-PT")} – ${new Date(f.data_fim).toLocaleDateString("pt-PT")}</div>
      <span class="status ${f.estado}">${f.estado}</span>
    </div>`).join("");
}
function openFeriasModal() { document.getElementById("fInicio").value = ""; document.getElementById("fFim").value = ""; document.getElementById("modalFerias").classList.add("active"); }
function closeModal() { document.getElementById("modalFerias").classList.remove("active"); }
async function guardarFerias() {
  const data_inicio = document.getElementById("fInicio").value;
  const data_fim = document.getElementById("fFim").value;
  if (!data_inicio || !data_fim) return;
  await sb("cj_horarios_pedidos_ferias", { method: "POST", body: JSON.stringify([{ loja_id: state.loja.id, utilizador_id: state.user.id, data_inicio, data_fim }]) });
  closeModal();
  carregarFerias();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/cj-horarios-equipa/service-worker.js", { scope: "/cj-horarios-equipa/" }).catch(() => {});
  });
}
</script>
</body>
</html>
